<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Гардероб</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2A4BD7"><meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#F2F4F7;--ink:#101828;--mute:#667085;--line:#D9DEE7;--acc:#2A4BD7;--card:#fff;--onacc:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0E1320;--ink:#E8ECF4;--mute:#98A2B3;--line:#252E44;--acc:#7C9BFF;--card:#161D2E;--onacc:#0E1320}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line)}
h1{margin:0 0 8px;font:700 26px Georgia,serif;letter-spacing:-.5px}
nav{display:flex;gap:6px}nav button{flex:1;padding:9px 0;border:0;border-radius:10px;background:transparent;color:var(--mute);font:inherit;font-weight:600}
nav button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
main{max-width:640px;margin:0 auto;padding:12px 16px 40px}
.lbl{margin:16px 0 6px;font-weight:600}.hint{color:var(--mute);font-size:14px;margin:6px 0}.err{color:#D92D20;margin:12px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
textarea,input:not([type=file]){width:100%;padding:11px 12px;margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
textarea{height:64px;margin-top:16px;resize:none}
.main{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--acc);color:var(--onacc);font:inherit;font-weight:700;text-align:center}
.main:disabled{opacity:.5}.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px var(--line)}
.out{margin-top:16px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:14px}.out.chosen{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}figure{margin:0}
.row figure{flex:0 0 92px}.row img,#grid img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--line)}
figcaption{font-size:13px;margin-top:4px}figcaption small{display:block;color:var(--mute)}
.out p{margin:10px 0 0}.out .main{margin-top:12px;padding:11px}
.fb{display:flex;gap:8px;margin-top:10px}.fb button{width:46px;border:1px solid var(--line);border-radius:10px;background:transparent;font-size:18px}.fb button.on{background:var(--acc)}
.fb input{margin:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;margin-top:16px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));padding:12px;border-radius:12px;background:var(--ink);color:var(--bg);text-align:center}#msg:empty{display:none}
</style></head><body>
<header><h1>Гардероб</h1><nav><button data-t="pick" class="on">Подобрать</button><button data-t="closet">Вещи</button><button data-t="set">Настройки</button></nav></header>
<main>
<section id="pick">
<p class="lbl">Стиль</p><div class="chips" id="st"></div>
<p class="lbl">Цвета</p><div class="chips" id="co"></div>
<p class="lbl">Погода</p><div class="chips" id="we"></div><p class="hint" id="wh"></p>
<textarea id="wish" placeholder="Настроение или свои пожелания (необязательно)"></textarea>
<button class="main" id="go">Подобрать</button><div id="res"></div>
</section>
<section id="closet" hidden>
<label class="main">Добавить фото<input type="file" id="file" accept="image/*" multiple hidden></label>
<p class="hint" id="prog"></p><div id="grid"></div>
</section>
<section id="set" hidden>
<p class="lbl">Ключ Gemini API</p><input id="key" type="password" autocomplete="off" placeholder="Ключ из Google AI Studio">
<p class="lbl">Город для погоды</p><input id="city" placeholder="Город (необязательно)">
<p class="lbl">Модель</p><input id="mod" placeholder="gemini-flash-latest">
<button class="main" id="sv">Сохранить</button>
<p class="hint">Все вещи и оценки хранятся только в этом телефоне. Сделайте копию, если меняете устройство.</p>
<button class="main ghost" id="ex">Сохранить копию данных</button>
<label class="main ghost">Загрузить копию<input type="file" id="im" accept=".json" hidden></label>
</section>
</main><div id="msg"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const cfg=()=>JSON.parse(localStorage.cfg||'{}'),save=o=>localStorage.cfg=JSON.stringify({...cfg(),...o});
const say=t=>{$('#msg').textContent=t;clearTimeout(say.t);say.t=setTimeout(()=>$('#msg').textContent='',4000)};
const dbp=new Promise((ok,no)=>{const r=indexedDB.open('wardrobe',1);r.onupgradeneeded=()=>{r.result.createObjectStore('items',{keyPath:'id'});r.result.createObjectStore('log',{autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(s,m,f)=>{const d=await dbp;return new Promise((ok,no)=>{const t=d.transaction(s,m),q=f(t.objectStore(s));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll());
const CAT={top:'верх',bottom:'низ',dress:'платье',shoes:'обувь',outer:'верхняя одежда',accessory:'аксессуар'};
const SLOT={top:['top','dress'],bottom:['bottom'],shoes:['shoes'],outer:['outer'],accessory:['accessory']};
const STY={walk:['Прогулка с собакой','неяркая, немаркая, неброская и практичная одежда, ничего нарядного (формальность 1-2, яркость низкая)'],event:['Мероприятие','самая элегантная и красивая одежда из имеющейся (формальность 4-5)'],day:['Обычный день','удобное, нейтральное, без изысков (формальность 2-3)'],sport:['Спорт','спортивная, комфортная одежда']};
const WE=['Холодно (до +5°)','Прохладно (+5…+15°)','Тепло (+15…+25°)','Жарко (от +25°)','Дождь'];
const ANA='На фото одна вещь одежды. Верни JSON: {"name":"короткое название по-русски","cat":"top|bottom|dress|shoes|outer|accessory","colors":["до 3 основных цветов, по-русски, одно слово, нижний регистр"],"style":["casual|sport|elegant|classic|street"],"season":["зима|весна|лето|осень"],"formality":1-5,"bold":1-5}. formality: 1 очень простая, 5 очень нарядная. bold: 1 неброская, 5 очень яркая. top: футболка, рубашка, свитер; outer: куртка, пальто; dress: платье или комбинезон.';
let items=[],outs=[],sel={st:'',co:new Set(),we:''};
const nm=id=>items.find(i=>i.id==id)?.name||'?';

async function gem(parts,temp){const s=cfg();if(!s.key)throw Error('Сначала добавьте ключ Gemini в настройках');
 for(let i=0;i<4;i++){const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${s.model||'gemini-flash-latest'}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':s.key},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',temperature:temp}})});
  if(r.status==429||r.status==503){await sleep(7000*(i+1));continue}
  const j=await r.json();if(!r.ok)throw Error(j.error?.message||'Ошибка '+r.status);
  return JSON.parse(j.candidates[0].content.parts.map(p=>p.text||'').join('').replace(/```json|```/g,''))}
 throw Error('Достигнут лимит Gemini, попробуйте через минуту')}

async function shrink(f,max=640){const b=await createImageBitmap(f),k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}

function drawChips(){const on=(c,v)=>c?' on':'',cs=[...new Set(items.flatMap(i=>i.colors))];
 const h=(list,f,lab)=>list.map(x=>`<button class="chip${f(x)?' on':''}" data-v="${esc(x)}">${esc(lab?lab(x):x)}</button>`).join('');
 $('#st').innerHTML=h(Object.keys(STY),x=>sel.st==x,x=>STY[x][0]);
 $('#co').innerHTML=cs.length?h(cs,x=>sel.co.has(x)):'<span class="hint">Появятся, когда добавите вещи</span>';
 $('#we').innerHTML=h(WE,x=>sel.we==x);
 $('#wh').textContent=cfg().lat?'Если не выбрано, возьму текущую погоду вашего города.':'Если не выбрано, погода не учитывается. Город можно задать в настройках.'}
document.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const p=c.parentElement.id,v=c.dataset.v;
 if(p=='co')sel.co.has(v)?sel.co.delete(v):sel.co.add(v);else{const k=p=='st'?'st':'we';sel[k]=sel[k]==v?'':v}drawChips()});
document.querySelector('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('section').forEach(s=>s.hidden=s.id!=t);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==e.target))};

async function load(){items=await all('items');items.sort((a,b)=>b.added-a.added);
 $('#grid').innerHTML=items.length?items.map(i=>`<figure data-id="${i.id}"><img src="${i.img}"><figcaption>${esc(i.name)}<small>${CAT[i.cat]}</small></figcaption></figure>`).join(''):'<p class="hint">Пока пусто. Добавьте фото вещей: по одной вещи на снимке, на ровном фоне.</p>';drawChips()}
$('#grid').onclick=async e=>{const f=e.target.closest('figure');if(f&&confirm('Удалить вещь?')){await tx('items','readwrite',o=>o.delete(f.dataset.id));load()}};
$('#file').onchange=async e=>{const fs=[...e.target.files];e.target.value='';let n=0;
 for(const f of fs){$('#prog').textContent=`Описываю вещь ${++n} из ${fs.length}…`;
  try{const img=await shrink(f),d=await gem([{text:ANA},{inline_data:{mime_type:'image/jpeg',data:img.split(',')[1]}}],.2);
   await tx('items','readwrite',o=>o.put({id:crypto.randomUUID(),img,name:d.name||'Вещь',cat:CAT[d.cat]?d.cat:'top',colors:d.colors||[],style:d.style||[],season:d.season||[],formality:d.formality||3,bold:d.bold||2,added:Date.now()}));
   if(n<fs.length)await sleep(4500)}catch(err){$('#prog').textContent='';return say(err.message)}}
 $('#prog').textContent='';load()};

async function weather(){const s=cfg();if(!s.lat)return'';try{const c=(await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&current=temperature_2m,precipitation`)).json()).current;return`сейчас ${Math.round(c.temperature_2m)}°C${c.precipitation>0?', идут осадки':''}`}catch{return''}}

$('#go').onclick=async()=>{if(items.length<3)return say('Сначала добавьте вещи (верх, низ, обувь) на вкладке «Вещи»');
 $('#go').disabled=true;$('#res').innerHTML='<p class="hint">Подбираю образы…</p>';
 try{const w=sel.we||await weather(),log=await all('log'),
  worn=log.filter(l=>l.t=='worn'&&Date.now()-l.at<4*864e5).flatMap(l=>l.ids),
  fb=log.filter(l=>l.t=='fb').slice(-20).map(l=>`${l.r>0?'понравилось':'не понравилось'}: ${l.ids.map(nm).join(' + ')}${l.c?' (комментарий: '+l.c+')':''}`),
  cat=items.map(i=>({id:i.id,name:i.name,cat:i.cat,colors:i.colors,style:i.style,season:i.season,formality:i.formality,bold:i.bold})),wish=$('#wish').value.trim();
  const p=`Ты стилист. Из гардероба составь ровно 5 разных образов.
Гардероб: ${JSON.stringify(cat)}
Правила: образ = top (cat top или dress; платье заменяет низ, тогда bottom=null) + bottom + shoes; outer (cat outer) добавляй, только если нужен по погоде; accessory = id вещи cat accessory или null, иначе accessory_idea = короткая идея аксессуара или null. Используй ТОЛЬКО id из гардероба, не выдумывай вещей. Образы должны заметно отличаться.
${sel.st?'Стиль: '+STY[sel.st][1]+'.':''}
${sel.co.size?'Цвета (важнее стиля): '+[...sel.co].join(', ')+'.':''}
${w?'Погода: '+w+'.':''}
${wish?'Пожелания: '+wish:''}
${worn.length?'Недавно надетые id, не повторяй: '+worn.join(', '):''}
${fb.length?'Прошлые оценки пользователя, учитывай вкус:\n'+fb.join('\n'):''}
Если вещей не хватает под условия, скажи об этом в note и предложи ближайший вариант.
Ответ JSON: {"outfits":[{"top":"id","bottom":"id|null","shoes":"id","outer":"id|null","accessory":"id|null","accessory_idea":"строка|null","why":"1-2 предложения по-русски"}],"note":"строка|null"}`;
  render(await gem([{text:p}],1))}catch(e){$('#res').innerHTML=`<p class="err">${esc(e.message)}</p>`}
 $('#go').disabled=false};

function render(d){const get=(id,k)=>{const i=items.find(x=>x.id==id);return i&&SLOT[k].includes(i.cat)?i:null};
 outs=(d.outfits||[]).map(o=>{const t=get(o.top,'top'),b=get(o.bottom,'bottom'),s=get(o.shoes,'shoes');
  if(!t||!s||(t.cat!='dress'&&!b))return null;
  return{its:[t,t.cat=='dress'?null:b,s,get(o.outer,'outer'),get(o.accessory,'accessory')].filter(Boolean),idea:o.accessory_idea,why:o.why}}).filter(Boolean).slice(0,5);
 $('#res').innerHTML=(d.note?`<p class="hint">${esc(d.note)}</p>`:'')+(outs.length?outs.map((o,n)=>`<article class="out" data-n="${n}"><div class="row">${o.its.map(i=>`<figure><img src="${i.img}"><figcaption>${esc(i.name)}</figcaption></figure>`).join('')}</div><p>${esc(o.why)}</p>${o.idea&&!o.its.some(i=>i.cat=='accessory')?`<p class="hint">Аксессуар: ${esc(o.idea)}</p>`:''}<button class="main pick">Надену этот</button><div class="fb"><button data-r="1">👍</button><button data-r="-1">👎</button><input placeholder="Комментарий (необязательно)"></div></article>`).join(''):'<p class="err">Не получилось составить образы. Попробуйте ещё раз.</p>')}
$('#res').onclick=async e=>{const a=e.target.closest('.out');if(!a)return;const ids=outs[a.dataset.n].its.map(i=>i.id);
 if(e.target.matches('.pick')){await tx('log','readwrite',o=>o.add({t:'worn',ids,at:Date.now()}));a.classList.add('chosen');e.target.textContent='Выбрано'}
 else if(e.target.dataset.r){await tx('log','readwrite',o=>o.add({t:'fb',ids,r:+e.target.dataset.r,c:a.querySelector('input').value.trim(),at:Date.now()}));e.target.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b==e.target))}};

$('#sv').onclick=async()=>{const o={key:$('#key').value.trim(),model:$('#mod').value.trim()},c=$('#city').value.trim();
 if(!c)Object.assign(o,{city:'',lat:0,lon:0});
 else if(c!=cfg().city){try{const p=(await(await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(c)}&count=1&language=ru`)).json()).results?.[0];if(!p)return say('Город не найден');Object.assign(o,{city:c,lat:p.latitude,lon:p.longitude})}catch{return say('Не удалось найти город')}}
 save(o);drawChips();say('Сохранено')};
$('#ex').onclick=async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({items:await all('items'),log:await all('log')})],{type:'application/json'}));a.download='wardrobe.json';a.click()};
$('#im').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());for(const i of d.items)await tx('items','readwrite',o=>o.put(i));for(const l of d.log)await tx('log','readwrite',o=>o.add(l));load();say('Копия загружена')}catch{say('Не удалось прочитать файл')}};

const s0=cfg();$('#key').value=s0.key||'';$('#city').value=s0.city||'';$('#mod').value=s0.model||'';
navigator.storage?.persist?.();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
load();
</script></body></html>
